        const fileList = document.getElementById('file-list');
        const iframe = document.querySelector('iframe');
        const mdViewer = document.getElementById('md-viewer');
        const rootPath = '/Users/gabriel.vaz/dev-apps/cardioline-manuals-and-ux-studies/';

        files.sort().forEach(filePath => {
            const relativePath = filePath.replace(rootPath, '');
            const fileName = relativePath.split('/').pop();
            const extension = fileName.split('.').pop();
            const format = extension.toUpperCase();
            
            let displayName = fileName.replace(/\.(pdf|md)$/i, '').replace(/[-_]/g, ' ');
            displayName = displayName.replace(/\b\w/g, l => l.toUpperCase()); // Capitalize words

            const listItem = document.createElement('li');
            const link = document.createElement('a');
            link.href = '#';
            link.dataset.filePath = relativePath;
            
            const nameSpan = document.createElement('span');
            nameSpan.textContent = displayName;
            
            const infoSpan = document.createElement('div');
            infoSpan.className = 'file-info';
            infoSpan.textContent = `${format}`;
            
            link.appendChild(nameSpan);
            link.appendChild(infoSpan);
            
            listItem.appendChild(link);
            fileList.appendChild(listItem);
        });

        // PDF.js setup
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/js/pdf.worker.min.js';
        
        let currentPdf = null;
        let currentPage = 1;
        let totalPages = 0;
        let currentScale = 1.0;
        
        const pdfViewer = document.getElementById('pdf-viewer');
        const pdfCanvas = document.getElementById('pdf-canvas');
        const pdfControls = document.getElementById('pdf-controls');
        const pageInfo = document.getElementById('page-info');
        const zoomLevel = document.getElementById('zoom-level');
        const ctx = pdfCanvas.getContext('2d');
        
        function renderPage(pageNum) {
            currentPdf.getPage(pageNum).then(page => {
                const viewport = page.getViewport({ scale: currentScale });
                pdfCanvas.height = viewport.height;
                pdfCanvas.width = viewport.width;
                
                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                
                page.render(renderContext);
                pageInfo.textContent = `Página ${pageNum} de ${totalPages}`;
                
                // Update navigation buttons
                document.getElementById('prev-page').disabled = pageNum <= 1;
                document.getElementById('next-page').disabled = pageNum >= totalPages;
            });
        }
        
        function loadPdf(url) {
            pdfjsLib.getDocument(url).promise.then(pdf => {
                currentPdf = pdf;
                totalPages = pdf.numPages;
                currentPage = 1;
                renderPage(currentPage);
                
                // Show PDF viewer and controls
                iframe.style.display = 'none';
                mdViewer.style.display = 'none';
                pdfViewer.style.display = 'block';
                pdfControls.style.display = 'flex';
            }).catch(error => {
                console.error('Erro ao carregar PDF:', error);
                alert('Erro ao carregar o PDF. Verifique se o arquivo existe.');
            });
        }

        async function loadMarkdown(url) {
            try {
                // Garantir que qualquer PDF aberto seja ocultado
                pdfViewer.style.display = 'none';
                pdfControls.style.display = 'none';
                iframe.style.display = 'none';

                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const text = await resp.text();
                const html = marked.parse(text);
                mdViewer.innerHTML = html;
                mdViewer.scrollTop = 0;
                mdViewer.style.display = 'block';
            } catch (err) {
                console.error('Erro ao carregar Markdown:', err);
                alert('Erro ao abrir o documento Markdown.');
            }
        }
        
        function closePdf() {
            pdfViewer.style.display = 'none';
            pdfControls.style.display = 'none';
            mdViewer.style.display = 'none';
            iframe.style.display = 'block';
            iframe.src = 'about:blank';
            currentPdf = null;
            
            // Remove active class from all links
            document.querySelectorAll('#file-list a').forEach(a => a.classList.remove('active'));
        }
        
        // PDF Controls Event Listeners
        document.getElementById('prev-page').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
            }
        });
        
        document.getElementById('next-page').addEventListener('click', () => {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
            }
        });
        
        document.getElementById('zoom-in').addEventListener('click', () => {
            currentScale += 0.25;
            zoomLevel.textContent = Math.round(currentScale * 100) + '%';
            renderPage(currentPage);
        });
        
        document.getElementById('zoom-out').addEventListener('click', () => {
            if (currentScale > 0.5) {
                currentScale -= 0.25;
                zoomLevel.textContent = Math.round(currentScale * 100) + '%';
                renderPage(currentPage);
            }
        });
        
        document.getElementById('close-pdf').addEventListener('click', closePdf);
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (pdfViewer.style.display === 'block') {
                switch(e.key) {
                    case 'ArrowLeft':
                        if (currentPage > 1) {
                            currentPage--;
                            renderPage(currentPage);
                        }
                        break;
                    case 'ArrowRight':
                        if (currentPage < totalPages) {
                            currentPage++;
                            renderPage(currentPage);
                        }
                        break;
                    case 'Escape':
                        closePdf();
                        break;
                }
            }
        });

        fileList.addEventListener('click', function(e) {
            e.preventDefault();
            let target = e.target;
            while (target && target.tagName !== 'A') {
                target = target.parentElement;
            }

            if (target) {
                // Remove active class from all links
                document.querySelectorAll('#file-list a').forEach(a => a.classList.remove('active'));
                // Add active class to the clicked link
                target.classList.add('active');
                
                const filePath = target.dataset.filePath;
                const lower = filePath.toLowerCase();
                if (lower.endsWith('.pdf')) {
                    loadPdf(filePath);
                } else if (lower.endsWith('.md') || lower.endsWith('.markdown')) {
                    loadMarkdown(filePath);
                } else {
                    // Fallback: tentar abrir no iframe
                    pdfViewer.style.display = 'none';
                    pdfControls.style.display = 'none';
                    mdViewer.style.display = 'none';
                    iframe.style.display = 'block';
                    iframe.src = filePath;
                }
            }
        });
    </script>
